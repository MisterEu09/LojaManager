[versions]
# Gradle Plugins
agp = "8.11.1" # Versão estável. A 8.11.1 que você tinha parece ser uma versão bem recente/experimental.
kotlin = "2.2.0" # Alinhado com a versão do jvmTarget e languageVersion/apiVersion do seu build.gradle.kts
googleServices = "4.4.3" # Versão estável e compatível
googleFirebaseCrashlytics = "3.0.5" # Mantido como plugin

# AndroidX Core
coreKtx = "1.16.0"
appcompat = "1.7.1"
activity = "1.10.1"
constraintlayout = "2.2.1"
opencsv = "5.12.0"
recyclerview = "1.4.0" # Versão mais recente e estável
cardview = "1.0.0" # Não há versões mais recentes para essa
drawerlayout = "1.2.0" # Não há versões mais recentes para essa
annotation = "1.9.1" # Versão estável

# AndroidX Lifecycle
lifecycleRuntimeKtx = "2.9.2"
lifecycleLivedataKtx = "2.9.2"
lifecycleViewmodelKtx = "2.9.2"

# Room Database
roomCompiler = "2.7.2" # Mantenha a versão se seu código estiver ok com ela
roomKtx = "2.7.2"
roomRuntime = "2.7.2"

# Coroutines
kotlinxCoroutinesAndroid = "1.10.2"
kotlinxCoroutinesCore = "1.10.2"
kotlinxCoroutinesPlayServices = "1.10.2"

# UI Libraries
material = "1.12.0"
circleimageview = "3.1.0"
flexbox = "3.0.0"

# Image Loading (Glide)
glideVersion = "4.16.0"
compilerVersion = "4.16.0" # Para o annotationProcessor do Glide

# Networking (Retrofit/OkHttp)
retrofit = "3.0.0" # Versão mais recente e estável do Retrofit
converterGson = "3.0.0" # Alinhado com a versão do Retrofit
loggingInterceptor = "5.1.0" # Versão mais recente do OkHttp Logging Interceptor
retrofit2KotlinCoroutinesAdapter = "0.9.2" # Essa biblioteca parece não ter recebido atualizações recentes, mas se funciona, mantenha.

# Firebase (Apenas o BOM para gerenciar versões automaticamente)
firebaseBom = "33.1.0" # Use esta como a versão do BOM principal e mais atualizada.

# Testes
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"

[libraries]
# AndroidX Core & UI
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
androidx-cardview = { group = "androidx.cardview", name = "cardview", version.ref = "cardview" }
androidx-drawerlayout = { group = "androidx.drawerlayout", name = "drawerlayout", version.ref = "drawerlayout" }
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }

# AndroidX Lifecycle
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-livedata-ktx = { group = "androidx.lifecycle", name = "lifecycle-livedata-ktx", version.ref = "lifecycleLivedataKtx" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycleViewmodelKtx" }

# Room Database
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomCompiler" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomKtx" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomRuntime" }

# Kotlin Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
kotlinx-coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "kotlinxCoroutinesPlayServices" }

# UI Libraries
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
circleimageview = { group = "de.hdodenhof", name = "circleimageview", version.ref = "circleimageview" }
flexbox = { group = "com.google.android.flexbox", name = "flexbox", version.ref = "flexbox" }

# Image Loading (Glide)
github-glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glideVersion" }
glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "compilerVersion" }

# Networking (Retrofit/OkHttp)
opencsv = { module = "com.opencsv:opencsv", version.ref = "opencsv" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "converterGson" }
logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "loggingInterceptor" }
retrofit2-kotlin-coroutines-adapter = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlin-coroutines-adapter", version.ref = "retrofit2KotlinCoroutinesAdapter" }

# Firebase (Gerenciado pelo BOM)
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" } # Sem versão
firebase-auth-ktx = { group = "com.google.firebase", name = "firebase-auth-ktx" } # Sem versão
firebase-firestore-ktx = { group = "com.google.firebase", name = "firebase-firestore-ktx" } # Sem versão
firebase-storage-ktx = { group = "com.google.firebase", name = "firebase-storage-ktx" } # Sem versão
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" } # Sem versão

# Testes
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
google-firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "googleFirebaseCrashlytics" }